
name: Project-04 Blog CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_FRONTEND: project4-blog-frontend
  ECR_BACKEND: project4-blog-backend

jobs:
  validate:
    name: Validate Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Check backend syntax
        working-directory: backend
        run: node --check src/server.js

  build-scan-push:
    name: Build, Scan and Push Images
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build frontend image
        run: |
          docker build -t $ECR_FRONTEND:${GITHUB_SHA} ./frontend

      - name: Build backend image
        run: |
          docker build -t $ECR_BACKEND:${GITHUB_SHA} ./backend

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ECR_FRONTEND }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ECR_BACKEND }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Tag and push images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker tag $ECR_FRONTEND:${GITHUB_SHA} $REGISTRY/$ECR_FRONTEND:${GITHUB_SHA}
          docker tag $ECR_BACKEND:${GITHUB_SHA} $REGISTRY/$ECR_BACKEND:${GITHUB_SHA}
          docker push $REGISTRY/$ECR_FRONTEND:${GITHUB_SHA}
          docker push $REGISTRY/$ECR_BACKEND:${GITHUB_SHA}

  sonarqube-analysis:
    name: SonarQube Code Analysis
    runs-on: [self-hosted, Windows, X64]
    needs: validate
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: SonarQube Scan
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://localhost:9000
        run: |
          if (-not (Test-Path "C:\sonar-scanner\bin\sonar-scanner.bat")) {
            throw "SonarScanner CLI not found at C:\sonar-scanner\bin\sonar-scanner.bat"
          }

          & "C:\sonar-scanner\bin\sonar-scanner.bat" `
            "-Dsonar.host.url=$env:SONAR_HOST_URL" `
            "-Dsonar.token=$env:SONAR_TOKEN"

          if ($LASTEXITCODE -ne 0) {
            throw "SonarQube analysis failed with exit code $LASTEXITCODE"
          }
    
  nexus-publish:
    name: Publish Images to Nexus
    runs-on: [self-hosted, Windows, X64]
    needs: [validate, build-scan-push]
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to Nexus Docker Registry
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          $env:NEXUS_PASSWORD | docker login localhost:8082 `
            --username $env:NEXUS_USERNAME `
            --password-stdin

          if ($LASTEXITCODE -ne 0) {
            throw "Nexus Docker login failed"
          }

      - name: Build and push frontend image
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          docker build -t "localhost:8082/blog-frontend:${{ github.sha }}" ./frontend

          if ($LASTEXITCODE -ne 0) {
            throw "Frontend Docker build failed"
          }

          docker push "localhost:8082/blog-frontend:${{ github.sha }}"

          if ($LASTEXITCODE -ne 0) {
            throw "Frontend image push to Nexus failed"
          }

      - name: Build and push backend image
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          docker build -t "localhost:8082/blog-backend:${{ github.sha }}" ./backend

          if ($LASTEXITCODE -ne 0) {
            throw "Backend Docker build failed"
          }

          docker push "localhost:8082/blog-backend:${{ github.sha }}"

          if ($LASTEXITCODE -ne 0) {
            throw "Backend image push to Nexus failed"
          }
    